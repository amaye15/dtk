[package]
name = "dtk"
version = "0.13.0"
edition = "2021"
rust-version = "1.80"
description = "Data token killer: a Claude Code hook that turns big tables, CSV, JSON and JSONL tool output into lean summaries. Works with rtk."
license = "MIT"
readme = "README.md"
repository = "https://github.com/amaye15/dtk"
homepage = "https://github.com/amaye15/dtk"
keywords = ["claude-code", "llm", "tokens", "csv", "jsonl"]
categories = ["command-line-utilities", "development-tools"]
exclude = [".github/"]

[package.metadata.deb]
maintainer = "amaye15 <amaye15@users.noreply.github.com>"
copyright = "2026, dtk contributors"
license-file = ["LICENSE-MIT", "0"]
extended-description = """\
dtk is a Claude Code hook. It finds big tables in command output (CSV, JSON, JSON lines, \
logfmt, access logs, polars and psql tables) and replaces them with a short summary that \
covers every row. It works with rtk."""
section = "utils"
priority = "optional"
depends = ""
assets = [
    ["target/release/dtk", "usr/bin/", "755"],
    ["README.md", "usr/share/doc/dtk/README.md", "644"],
    ["CHANGELOG.md", "usr/share/doc/dtk/CHANGELOG.md", "644"],
]

[package.metadata.generate-rpm]
assets = [
    { source = "target/release/dtk", dest = "/usr/bin/dtk", mode = "755" },
    { source = "README.md", dest = "/usr/share/doc/dtk/README.md", mode = "644", doc = true },
    { source = "LICENSE-MIT", dest = "/usr/share/licenses/dtk/LICENSE-MIT", mode = "644", license = true },
]

[dependencies]
serde_json = { version = "1", features = ["preserve_order"] }
csv = "1"
toml = { version = "0.8", default-features = false, features = ["parse"] }
sha2 = "0.10"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
