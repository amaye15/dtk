[package]
name = "dtk"
version = "0.2.0"
edition = "2021"
rust-version = "1.80"
description = "Data token killer: a Claude Code hook that turns big tables, CSV, JSON and JSONL tool output into lean summaries. Works with rtk."
license = "MIT"
readme = "README.md"
repository = "https://github.com/amaye15/dtk"
homepage = "https://github.com/amaye15/dtk"
keywords = ["claude-code", "llm", "tokens", "csv", "jsonl"]
categories = ["command-line-utilities", "development-tools"]
exclude = [".github/"]

[dependencies]
serde_json = { version = "1", features = ["preserve_order"] }
csv = "1"
toml = { version = "0.8", default-features = false, features = ["parse"] }
sha2 = "0.10"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
