name: release

# A pushed tag (v*) publishes: the crate, the release files, the packages and checksums.txt.
# A pull request that touches packaging, or a manual run, builds and packages everything as
# workflow artifacts and publishes nothing. That is how a change here is tested before a tag.
on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "Cargo.toml"
      - "packaging/**"
  workflow_dispatch:

permissions:
  contents: write

env:
  PUBLISH: ${{ github.event_name == 'push' && 'true' || 'false' }}
  NAME_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || 'dev' }}

jobs:
  publish-crate:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Check that the tag matches Cargo.toml
        run: |
          version="$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')"
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME does not match Cargo.toml version $version"; exit 1; }
      - run: cargo test --locked
      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --locked

  # One job creates the release. The build jobs only upload to it.
  create-release:
    runs-on: ubuntu-latest
    steps:
      - if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --generate-notes

  build:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: x86_64-apple-darwin, os: macos-latest }
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm }
          - { target: x86_64-pc-windows-msvc, os: windows-latest }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install musl tools
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release --locked --target ${{ matrix.target }}

      # The binary sits at the top of the archive, as in rtk's archives.
      - name: Package (macOS, Linux)
        if: runner.os != 'Windows'
        run: |
          name="dtk-${NAME_VERSION}-${{ matrix.target }}"
          mkdir -p dist stage
          cp "target/${{ matrix.target }}/release/dtk" LICENSE-MIT README.md stage/
          tar -C stage -czf "dist/$name.tar.gz" dtk LICENSE-MIT README.md
          (cd dist && shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256")
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $name = "dtk-$env:NAME_VERSION-${{ matrix.target }}"
          New-Item -ItemType Directory -Force dist, stage | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/dtk.exe", LICENSE-MIT, README.md stage
          Compress-Archive -Path stage/* -DestinationPath "dist/$name.zip"
          $h = (Get-FileHash "dist/$name.zip" -Algorithm SHA256).Hash.ToLower()
          "$h  $name.zip" | Out-File -Encoding ascii "dist/$name.zip.sha256"

      - name: Upload to the release
        if: env.PUBLISH == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/* --clobber
      - name: Keep the files (dry run)
        if: env.PUBLISH != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          path: dist/*

  # .deb and .rpm, for both CPU types, each checked before it is uploaded.
  packages:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest, deb: amd64, rpm: x86_64 }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm, deb: arm64, rpm: aarch64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: sudo apt-get update && sudo apt-get install -y musl-tools rpm
      - run: cargo install cargo-deb cargo-generate-rpm --locked
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Build the packages
        run: |
          cargo deb --no-build --target ${{ matrix.target }} --output dist/
          cargo generate-rpm --target ${{ matrix.target }} -o dist/
          ls -l dist
      - name: Check the .deb
        run: |
          deb="$(ls dist/*.deb)"
          dpkg-deb --info "$deb"
          dpkg-deb --contents "$deb"
          sudo dpkg -i "$deb"
          dtk --version
          out="$(dtk verify || true)"
          echo "$out"
          # verify exits 1 for setup warnings (hook not registered, no qsv); the checks are what count
          echo "$out" | grep -q "built-in checks passed"
          ! echo "$out" | grep -q "^FAIL"
          sudo dpkg -r dtk
          # bash remembers where it ran dtk before, so ask the file system and not the hash table
          test ! -e /usr/bin/dtk
      - name: Check the .rpm
        run: |
          rpm_file="$(ls dist/*.rpm)"
          rpm -qpi "$rpm_file"
          rpm -qpl "$rpm_file" | tee /dev/stderr | grep -q '/usr/bin/dtk'
      - name: Stable names (like rtk_amd64.deb and rtk.x86_64.rpm)
        run: |
          cp dist/*.deb "dist/dtk_${{ matrix.deb }}.deb"
          cp dist/*.rpm "dist/dtk.${{ matrix.rpm }}.rpm"
      - name: Upload to the release
        if: env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/*.deb dist/*.rpm --clobber
      - name: Keep the files (dry run)
        if: env.PUBLISH != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.deb }}
          path: dist/*

  # One file with the SHA-256 of every release file, as rtk publishes.
  checksums:
    if: github.event_name == 'push'
    needs: [build, packages]
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir dl && cd dl
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --pattern '*.tar.gz' --pattern '*.zip' --pattern '*.deb' --pattern '*.rpm'
          sha256sum * > ../checksums.txt
          cat ../checksums.txt
          cd .. && gh release upload "$GITHUB_REF_NAME" checksums.txt --repo "$GITHUB_REPOSITORY" --clobber
